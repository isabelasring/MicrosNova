pluginManagement {
    repositories {
        maven { url "https://artifactory.apps.bancolombia.com/maven-bancolombia" }
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'InterpreteVision'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':interprete-vision'
project(':interprete-vision').projectDir = file('./infrastructure/entry-points/interprete-vision')
include ':vision-adapters'
project(':vision-adapters').projectDir = file('./infrastructure/driven-adapters/vision-adapters')